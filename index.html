<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Interval Timer</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intervals">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --accent-prepare: #ffd60a;
      --accent-work: #30d158;
      --accent-rest: #ff9f0a;
      --accent-done: #0a84ff;
      --text: #ffffff;
      --text-muted: #8e8e93;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: background-color 0.25s ease;
    }
    body.phase-prepare { background-color: #2c2500; }
    body.phase-work { background-color: #05240f; }
    body.phase-rest { background-color: #2b1800; }
    body.phase-done { background-color: #021a38; }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Timer Display */
    .timer-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .phase-badge {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    .phase-prepare .phase-badge { color: var(--accent-prepare); }
    .phase-work .phase-badge { color: var(--accent-work); }
    .phase-rest .phase-badge { color: var(--accent-rest); }
    .phase-done .phase-badge { color: var(--accent-done); }

    .time-large {
      font-size: clamp(5.5rem, 22vw, 8rem);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 10px 0;
    }
    .round-info {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .circle-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn:active { opacity: 0.7; }
    .btn-start { background: #0a3818; color: var(--accent-work); }
    .btn-pause { background: #402905; color: var(--accent-rest); }
    .btn-reset { background: #2c2c2e; color: #fff; }

    /* Configuration Panel */
    .config-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .row label {
      font-size: 1rem;
      color: #e5e5ea;
    }
    .row input {
      width: 90px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background: #000;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    /* Presets Section */
    .save-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .save-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #3a3a3c;
      background: #000;
      color: #fff;
      font-size: 0.95rem;
    }
    .save-row button {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: #2c2c2e;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .preset-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .preset-chip {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .preset-chip .preset-name {
      font-weight: 600;
      color: #fff;
    }
    .preset-chip .preset-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .preset-delete {
      color: #ff453a;
      background: transparent;
      border: none;
      font-size: 1.1rem;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="timer-card">
    <div class="phase-badge" id="phaseDisplay">Ready</div>
    <div class="time-large" id="timeDisplay">00:20</div>
    <div class="round-info" id="roundDisplay">Round 1 of 8</div>

    <div class="controls">
      <button class="circle-btn btn-reset" onclick="resetTimer()">Reset</button>
      <button class="circle-btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
    </div>
  </div>

  <div class="config-card">
    <div class="row">
      <label for="workInput">Work (seconds)</label>
      <input type="number" id="workInput" value="20" min="1" onchange="syncFromInputs()">
    </div>
    <div class="row">
      <label for="restInput">Rest (seconds)</label>
      <input type="number" id="restInput" value="10" min="0" onchange="syncFromInputs()">
    </div>
    <div class="row">
      <label for="roundsInput">Rounds</label>
      <input type="number" id="roundsInput" value="8" min="1" onchange="syncFromInputs()">
    </div>

    <div class="save-row">
      <input type="text" id="presetName" placeholder="Timer name (e.g. Tabata)">
      <button onclick="saveCurrentPreset()">Save</button>
    </div>

    <div class="preset-list" id="presetList"></div>
  </div>
</div>

<script>
  let config = { work: 20, rest: 10, rounds: 8 };
  let currentRound = 1;
  let phase = 'ready'; // 'ready', 'prepare', 'work', 'rest', 'done'
  let secondsRemaining = 20;
  let timerId = null;
  let wakeLock = null;
  let audioCtx = null;

  const body = document.body;
  const phaseDisplay = document.getElementById('phaseDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const roundDisplay = document.getElementById('roundDisplay');
  const startBtn = document.getElementById('startBtn');
  const workInput = document.getElementById('workInput');
  const restInput = document.getElementById('restInput');
  const roundsInput = document.getElementById('roundsInput');
  const presetList = document.getElementById('presetList');

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // Count-in blip (3, 2, 1)
  function playCountBlip() {
    initAudio();
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(550, audioCtx.currentTime); // Mid blip
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch(e) {}
  }

  // Punchy "GO" chime
  function playGoBlip() {
    initAudio();
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      
      // Rising frequency sweep
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1175, now + 0.08);

      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.35);
    } catch(e) {}
  }

  // Rest bell
  function playRestBlip() {
    initAudio();
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } catch(e) {}
  }

  // Done chime
  function playDoneFanfare() {
    [0, 150, 300].forEach((delay, idx) => {
      setTimeout(() => {
        initAudio();
        const freqs = [659, 880, 1318];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freqs[idx];
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      }, delay);
    });
  }

  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function updateUI() {
    timeDisplay.textContent = formatTime(secondsRemaining);
    roundDisplay.textContent = `Round ${currentRound} of ${config.rounds}`;
    phaseDisplay.textContent = phase === 'prepare' ? 'GET READY' : phase.toUpperCase();

    body.className = '';
    if (phase === 'prepare') body.classList.add('phase-prepare');
    else if (phase === 'work') body.classList.add('phase-work');
    else if (phase === 'rest') body.classList.add('phase-rest');
    else if (phase === 'done') body.classList.add('phase-done');
  }

  function syncFromInputs() {
    if (timerId) return;
    config.work = Math.max(1, parseInt(workInput.value) || 20);
    config.rest = Math.max(0, parseInt(restInput.value) || 0);
    config.rounds = Math.max(1, parseInt(roundsInput.value) || 1);
    resetTimer();
  }

  function toggleTimer() {
    initAudio();

    if (timerId) {
      // Pause
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'Start';
      startBtn.className = 'circle-btn btn-start';
      releaseWakeLock();
    } else {
      // Start or Resume
      requestWakeLock();
      if (phase === 'ready' || phase === 'done') {
        currentRound = 1;
        phase = 'prepare';
        secondsRemaining = 3;
        playCountBlip(); // 3
      }
      timerId = setInterval(tick, 1000);
      startBtn.textContent = 'Pause';
      startBtn.className = 'circle-btn btn-pause';
      updateUI();
    }
  }

  function tick() {
    if (phase === 'prepare') {
      if (secondsRemaining > 1) {
        secondsRemaining--;
        playCountBlip(); // 2, 1
      } else {
        phase = 'work';
        secondsRemaining = config.work;
        playGoBlip(); // GO!
      }
      updateUI();
      return;
    }

    if (secondsRemaining > 1) {
      secondsRemaining--;
      // 3, 2, 1 count blip right before phase changes
      if (secondsRemaining <= 3) {
        playCountBlip();
      }
      updateUI();
    } else {
      // Current block hit zero
      if (phase === 'work') {
        if (config.rest > 0 && currentRound <= config.rounds) {
          phase = 'rest';
          secondsRemaining = config.rest;
          playRestBlip();
        } else {
          advanceRound();
        }
      } else if (phase === 'rest') {
        advanceRound();
      }
      updateUI();
    }
  }

  function advanceRound() {
    if (currentRound < config.rounds) {
      currentRound++;
      phase = 'work';
      secondsRemaining = config.work;
      playGoBlip(); // Distinct sound as new round starts
    } else {
      phase = 'done';
      secondsRemaining = 0;
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'Start';
      startBtn.className = 'circle-btn btn-start';
      releaseWakeLock();
      playDoneFanfare();
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    timerId = null;
    phase = 'ready';
    currentRound = 1;
    secondsRemaining = config.work;
    startBtn.textContent = 'Start';
    startBtn.className = 'circle-btn btn-start';
    releaseWakeLock();
    updateUI();
  }

  function loadPresets() {
    const saved = localStorage.getItem('interval_presets');
    const presets = saved ? JSON.parse(saved) : [
      { name: 'Tabata', work: 20, rest: 10, rounds: 8 },
      { name: 'Boxing Rounds', work: 180, rest: 60, rounds: 5 }
    ];
    presetList.innerHTML = '';
    presets.forEach((p, idx) => {
      const chip = document.createElement('div');
      chip.className = 'preset-chip';
      chip.innerHTML = `
        <div onclick="applyPreset(${idx})">
          <div class="preset-name">${p.name}</div>
          <div class="preset-meta">${p.work}s Work • ${p.rest}s Rest • ${p.rounds} Rds</div>
        </div>
        <button class="preset-delete" onclick="deletePreset(${idx})">✕</button>
      `;
      presetList.appendChild(chip);
    });
  }

  function saveCurrentPreset() {
    const nameInput = document.getElementById('presetName');
    const name = nameInput.value.trim() || `Workout ${new Date().toLocaleDateString()}`;
    const saved = localStorage.getItem('interval_presets');
    const presets = saved ? JSON.parse(saved) : [];
    presets.push({
      name,
      work: parseInt(workInput.value) || 20,
      rest: parseInt(restInput.value) || 10,
      rounds: parseInt(roundsInput.value) || 8
    });
    localStorage.setItem('interval_presets', JSON.stringify(presets));
    nameInput.value = '';
    loadPresets();
  }

  function applyPreset(idx) {
    const presets = JSON.parse(localStorage.getItem('interval_presets'));
    const p = presets[idx];
    if (!p) return;
    workInput.value = p.work;
    restInput.value = p.rest;
    roundsInput.value = p.rounds;
    syncFromInputs();
  }

  function deletePreset(idx) {
    const presets = JSON.parse(localStorage.getItem('interval_presets'));
    presets.splice(idx, 1);
    localStorage.setItem('interval_presets', JSON.stringify(presets));
    loadPresets();
  }

  loadPresets();
  syncFromInputs();
</script>
</body>
</html>
