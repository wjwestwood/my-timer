<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Timer</title>
  <!-- Allows it to behave like a native iOS app when saved -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .display {
      font-size: clamp(4.5rem, 18vw, 7rem);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }
    .presets {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .presets button {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      color: #ff9f0a;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .circle-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease;
    }
    .circle-btn:active {
      opacity: 0.7;
    }
    .start {
      background-color: #0a3818;
      color: #34c759;
    }
    .pause {
      background-color: #402905;
      color: #ff9f0a;
    }
    .reset {
      background-color: #1c1c1e;
      color: #e5e5ea;
    }
  </style>
</head>
<body>

  <div class="display" id="timeDisplay">05:00</div>

  <div class="presets">
    <button onclick="setDuration(60)">1m</button>
    <button onclick="setDuration(300)">5m</button>
    <button onclick="setDuration(600)">10m</button>
    <button onclick="setDuration(1500)">25m</button>
  </div>

  <div class="controls">
    <button class="circle-btn reset" onclick="resetTimer()">Reset</button>
    <button class="circle-btn start" id="startBtn" onclick="toggleTimer()">Start</button>
  </div>

  <script>
    let totalSeconds = 300;
    let remaining = 300;
    let timerId = null;

    const display = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');

    // Web Audio Synthesizer (Beeps when done without external audio files)
    let audioCtx = null;
    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          }, i * 400);
        }
      } catch (e) {
        console.warn("Audio unavailable", e);
      }
    }

    function updateDisplay() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function toggleTimer() {
      // Initialize audio context on first user tap
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        startBtn.textContent = 'Start';
        startBtn.className = 'circle-btn start';
      } else {
        if (remaining <= 0) remaining = totalSeconds;
        timerId = setInterval(() => {
          if (remaining > 0) {
            remaining--;
            updateDisplay();
          } else {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Start';
            startBtn.className = 'circle-btn start';
            playBeep();
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          }
        }, 1000);
        startBtn.textContent = 'Pause';
        startBtn.className = 'circle-btn pause';
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      remaining = totalSeconds;
      startBtn.textContent = 'Start';
      startBtn.className = 'circle-btn start';
      updateDisplay();
    }

    function setDuration(secs) {
      clearInterval(timerId);
      timerId = null;
      totalSeconds = secs;
      remaining = secs;
      startBtn.textContent = 'Start';
      startBtn.className = 'circle-btn start';
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
