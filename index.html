<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Interval Timer</title>
  
  <link rel="apple-touch-icon" href="meeper.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intervals">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --field-bg: #0f172a;
      --accent-prepare: #38bdf8;
      --accent-work: #10b981;
      --accent-rest: #f59e0b;
      --accent-done: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font: 400 14px/1.5 "JetBrains Mono", monospace;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: background-color 0.25s ease;
    }
    button, input { font: inherit; }
    body.phase-prepare { background-color: #102333; }
    body.phase-work { background-color: #0d2823; }
    body.phase-rest { background-color: #2b2417; }
    body.phase-done { background-color: #102333; }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .timer-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .phase-badge {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    .phase-prepare .phase-badge { color: var(--accent-prepare); }
    .phase-work .phase-badge { color: var(--accent-work); }
    .phase-rest .phase-badge { color: var(--accent-rest); }
    .phase-done .phase-badge { color: var(--accent-done); }

    .time-large {
      font-size: clamp(5.5rem, 22vw, 8rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 10px 0;
    }
    .round-info {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-weight: 400;
      font-style: italic;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }
    .circle-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-btn:active { opacity: 0.7; }
    .btn-start { background: #12392f; color: #6ee7b7; }
    .btn-pause { background: #433316; color: #fcd34d; }
    .btn-reset { background: #253347; color: var(--text); }
    .feature-toggle {
      width: 76px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      font-style: italic;
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      cursor: pointer;
    }
    .feature-toggle:active { opacity: 0.7; }
    .toggle-track {
      width: 40px;
      height: 24px;
      padding: 3px;
      border-radius: 12px;
      background: #475569;
      transition: background-color 0.2s ease;
    }
    .toggle-track::after {
      content: "";
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text);
      transition: transform 0.2s ease;
    }
    .feature-toggle[aria-pressed="true"] { color: var(--text); }
    .feature-toggle[aria-pressed="true"] .toggle-track { background: var(--accent-work); }
    .feature-toggle[aria-pressed="true"] .toggle-track::after { transform: translateX(16px); }

    @media (max-width: 380px) {
      .controls { gap: 4px; }
      .circle-btn { width: 56px; height: 56px; }
      .feature-toggle { width: 58px; font-size: 0.62rem; }
    }

    .config-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .row label {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .row input {
      width: 90px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--field-bg);
      color: var(--text);
      font-size: 1rem;
      text-align: center;
    }
    .row input:focus, .save-row input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .12);
    }
    .save-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .save-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--field-bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    .save-row button {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #111827;
      font-weight: 700;
      cursor: pointer;
    }

    .preset-heading {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    .preset-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preset-chip {
      background: #253347;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .preset-chip .preset-name {
      font-weight: 600;
      color: var(--text);
    }
    .preset-chip .preset-meta {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-muted);
    }
    .preset-delete {
      color: #f87171;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="timer-card">
    <div class="phase-badge" id="phaseDisplay">Ready</div>
    <div class="time-large" id="timeDisplay">00:20</div>
    <div class="round-info" id="roundDisplay">Round 1 of 8</div>

    <div class="controls">
      <button class="feature-toggle" id="skipLastRestToggle" type="button" aria-pressed="true" onclick="toggleSkipLastRest()">
        <span>Skip last rest</span>
        <span class="toggle-track" aria-hidden="true"></span>
      </button>
      <button class="circle-btn btn-reset" onclick="resetTimer()">Reset</button>
      <button class="circle-btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="feature-toggle" id="halfwayCueToggle" type="button" aria-pressed="true" onclick="toggleHalfwayCue()">
        <span>Half-way cue</span>
        <span class="toggle-track" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div class="config-card">
    <div class="row">
      <label for="workInput">Work (seconds)</label>
      <input type="number" id="workInput" value="20" min="1" onchange="syncFromInputs()">
    </div>
    <div class="row">
      <label for="restInput">Rest (seconds)</label>
      <input type="number" id="restInput" value="10" min="0" onchange="syncFromInputs()">
    </div>
    <div class="row">
      <label for="roundsInput">Rounds</label>
      <input type="number" id="roundsInput" value="8" min="1" onchange="syncFromInputs()">
    </div>

    <div class="save-row">
      <input type="text" id="presetName" placeholder="Name this workout (e.g. Sprint)">
      <button onclick="saveCurrentPreset()">Save</button>
    </div>

    <div class="preset-heading">Saved Workouts</div>
    <div class="preset-list" id="presetList"></div>
  </div>
</div>

<script>
  let config = { work: 20, rest: 10, rounds: 8 };
  let currentRound = 1;
  let phase = 'ready';
  let secondsRemaining = 20;
  let timerId = null;
  let wakeLock = null;
  let skipLastRest = true;
  let halfwayCueEnabled = true;

  let audioCtx = null;
  let isAudioUnlocked = false;
  let gongBuffer = null;
  let rawGongArrayBuffer = null;
  let halfwayCueBuffer = null;
  let rawHalfwayCueArrayBuffer = null;
  let midwayCuePlayedThisWork = false;

  const DEFAULT_PRESETS = [
    { name: 'Tabata', work: 20, rest: 10, rounds: 8 },
    { name: 'Boxing Rounds', work: 180, rest: 60, rounds: 5 }
  ];

  const body = document.body;
  const phaseDisplay = document.getElementById('phaseDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const roundDisplay = document.getElementById('roundDisplay');
  const startBtn = document.getElementById('startBtn');
  const workInput = document.getElementById('workInput');
  const restInput = document.getElementById('restInput');
  const roundsInput = document.getElementById('roundsInput');
  const presetList = document.getElementById('presetList');

  // Pre-fetch raw binary data immediately so it is cached in RAM before user even taps Start
  fetch('gong.mp3')
    .then(r => r.arrayBuffer())
    .then(buf => {
      rawGongArrayBuffer = buf;
      // If audio context was already instantiated, decode right away
      if (audioCtx && !gongBuffer) {
        audioCtx.decodeAudioData(buf.slice(0), decoded => { gongBuffer = decoded; });
      }
    })
    .catch(() => {});

  fetch('alf way.mp3')
    .then(r => r.arrayBuffer())
    .then(buf => {
      rawHalfwayCueArrayBuffer = buf;
      if (audioCtx && !halfwayCueBuffer) {
        audioCtx.decodeAudioData(buf.slice(0), decoded => { halfwayCueBuffer = decoded; });
      }
    })
    .catch(() => {});

  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (!isAudioUnlocked) {
      try {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        isAudioUnlocked = true;
      } catch (e) {}
    }

    // Decode gong directly into memory if ready
    if (!gongBuffer && rawGongArrayBuffer) {
      audioCtx.decodeAudioData(rawGongArrayBuffer.slice(0), decoded => {
        gongBuffer = decoded;
      }, () => {});
    }
  }

  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  function playTone(freq, duration, type = 'sine', sweepTo = null) {
    unlockAudio();
    if (!audioCtx) return;

    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (sweepTo) {
        osc.frequency.exponentialRampToValueAtTime(sweepTo, now + duration);
      }

      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration);
    } catch(e) {}
  }

  function playCountBlip() {
    playTone(600, 0.12, 'sine');
  }

  function playGoBlip() {
    playTone(880, 0.35, 'triangle', 1250);
  }

  function playRestBlip() {
    playTone(440, 0.25, 'sine');
  }

  function playAudioBuffer(buffer) {
    if (!audioCtx || !buffer) return;
    try {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(audioCtx.currentTime);
    } catch (e) {}
  }

  function playHalfwayCue() {
    if (!halfwayCueEnabled) return;
    unlockAudio();
    if (!audioCtx) return;

    if (halfwayCueBuffer) {
      playAudioBuffer(halfwayCueBuffer);
      return;
    }

    if (rawHalfwayCueArrayBuffer) {
      audioCtx.decodeAudioData(rawHalfwayCueArrayBuffer.slice(0), decoded => {
        halfwayCueBuffer = decoded;
        playAudioBuffer(decoded);
      }, () => {});
      return;
    }

    playCountBlip();
  }

  // Instant trigger with 0ms delay
  function playGongInstant() {
    unlockAudio();
    if (!audioCtx) return;

    if (gongBuffer) {
      try {
        const source = audioCtx.createBufferSource();
        source.buffer = gongBuffer;
        source.connect(audioCtx.destination);
        // Hardware zero-latency scheduling
        source.start(audioCtx.currentTime);
        return;
      } catch (e) {}
    }

    // If for any reason the MP3 was not yet decoded, fallback synthesizer fires with 0ms delay
    const now = audioCtx.currentTime;
    [212, 334, 472, 618].forEach(f => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 3.5);
    });
  }

  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function updateUI() {
    timeDisplay.textContent = formatTime(secondsRemaining);
    roundDisplay.textContent = `Round ${currentRound} of ${config.rounds}`;
    phaseDisplay.textContent = phase === 'prepare' ? 'GET READY' : phase.toUpperCase();

    body.className = '';
    if (phase === 'prepare') body.classList.add('phase-prepare');
    else if (phase === 'work') body.classList.add('phase-work');
    else if (phase === 'rest') body.classList.add('phase-rest');
    else if (phase === 'done') body.classList.add('phase-done');
  }

  function syncFromInputs() {
    if (timerId) return;
    config.work = Math.max(1, parseInt(workInput.value) || 20);
    config.rest = Math.max(0, parseInt(restInput.value) || 0);
    config.rounds = Math.max(1, parseInt(roundsInput.value) || 1);
    resetTimer();
  }

  function toggleSkipLastRest() {
    skipLastRest = !skipLastRest;
    document.getElementById('skipLastRestToggle').setAttribute('aria-pressed', skipLastRest);
  }

  function toggleHalfwayCue() {
    halfwayCueEnabled = !halfwayCueEnabled;
    document.getElementById('halfwayCueToggle').setAttribute('aria-pressed', halfwayCueEnabled);
  }

  function toggleTimer() {
    unlockAudio();

    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'Start';
      startBtn.className = 'circle-btn btn-start';
      releaseWakeLock();
    } else {
      requestWakeLock();
      if (phase === 'ready' || phase === 'done') {
        currentRound = 1;
        phase = 'prepare';
        secondsRemaining = 3;
        midwayCuePlayedThisWork = false;
        playCountBlip();
      }
      timerId = setInterval(tick, 1000);
      startBtn.textContent = 'Pause';
      startBtn.className = 'circle-btn btn-pause';
      updateUI();
    }
  }

  function tick() {
    if (phase === 'prepare') {
      if (secondsRemaining > 1) {
        secondsRemaining--;
        playCountBlip();
      } else {
        phase = 'work';
        secondsRemaining = config.work;
        midwayCuePlayedThisWork = false;
        playGoBlip();
      }
      updateUI();
      return;
    }

    if (phase === 'work') {
      const midpointThreshold = Math.max(1, Math.ceil(config.work / 2 + 0.5));
      if (!midwayCuePlayedThisWork && secondsRemaining <= midpointThreshold) {
        midwayCuePlayedThisWork = true;
        playHalfwayCue();
      }
    }

    if (secondsRemaining > 1) {
      secondsRemaining--;
      if (secondsRemaining <= 3) {
        playCountBlip();
      }
      updateUI();
    } else {
      if (phase === 'work') {
        if (config.rest > 0 && (!skipLastRest || currentRound < config.rounds)) {
          phase = 'rest';
          secondsRemaining = config.rest;
          playRestBlip();
        } else {
          advanceRound();
        }
      } else if (phase === 'rest') {
        advanceRound();
      }
      updateUI();
    }
  }

  function advanceRound() {
    if (currentRound < config.rounds) {
      currentRound++;
      phase = 'work';
      secondsRemaining = config.work;
      midwayCuePlayedThisWork = false;
      playGoBlip();
    } else {
      phase = 'done';
      secondsRemaining = 0;
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'Start';
      startBtn.className = 'circle-btn btn-start';
      releaseWakeLock();
      playGongInstant();
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    timerId = null;
    phase = 'ready';
    currentRound = 1;
    secondsRemaining = config.work;
    midwayCuePlayedThisWork = false;
    startBtn.textContent = 'Start';
    startBtn.className = 'circle-btn btn-start';
    releaseWakeLock();
    updateUI();
  }

  function getStoredPresets() {
    const raw = localStorage.getItem('interval_presets_v10');
    if (!raw) {
      localStorage.setItem('interval_presets_v10', JSON.stringify(DEFAULT_PRESETS));
      return [...DEFAULT_PRESETS];
    }
    return JSON.parse(raw);
  }

  function renderPresets() {
    const presets = getStoredPresets();
    presetList.innerHTML = '';
    presets.forEach((p, idx) => {
      const chip = document.createElement('div');
      chip.className = 'preset-chip';
      chip.innerHTML = `
        <div onclick="applyPreset(${idx})" style="flex:1;">
          <div class="preset-name">${p.name}</div>
          <div class="preset-meta">${p.work}s Work • ${p.rest}s Rest • ${p.rounds} Rds</div>
        </div>
        <button class="preset-delete" onclick="deletePreset(${idx})">✕</button>
      `;
      presetList.appendChild(chip);
    });
  }

  function saveCurrentPreset() {
    const nameInput = document.getElementById('presetName');
    const name = nameInput.value.trim() || `Workout ${new Date().toLocaleDateString()}`;
    const presets = getStoredPresets();
    presets.push({
      name,
      work: parseInt(workInput.value) || 20,
      rest: parseInt(restInput.value) || 10,
      rounds: parseInt(roundsInput.value) || 8
    });
    localStorage.setItem('interval_presets_v10', JSON.stringify(presets));
    nameInput.value = '';
    renderPresets();
  }

  function applyPreset(idx) {
    const presets = getStoredPresets();
    const p = presets[idx];
    if (!p) return;
    workInput.value = p.work;
    restInput.value = p.rest;
    roundsInput.value = p.rounds;
    syncFromInputs();
  }

  function deletePreset(idx) {
    const presets = getStoredPresets();
    presets.splice(idx, 1);
    localStorage.setItem('interval_presets_v10', JSON.stringify(presets));
    renderPresets();
  }

  renderPresets();
  syncFromInputs();
</script>
</body>
</html>
